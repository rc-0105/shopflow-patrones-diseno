spring.application.name=shopflow
server.port=8080
# Probabilidad de que LegacyPay responda con timeout (0.0 a 1.0)
shopflow.legacypay.probabilidad-timeout=0.3
# Capas (decoradores) que se aplican a cada pasarela de pago
shopflow.pagos.auditoria=true
shopflow.pagos.reintentos=true
shopflow.pagos.max-intentos=3
